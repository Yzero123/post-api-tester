<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>通用 POST 接口测试工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 字体异步加载：网络不通（如国内无法访问 Google Fonts）时不阻塞首屏，直接回退到系统字体 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" media="print" onload="this.media='all';this.onload=null">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap"></noscript>
  <style>
    :root {
      --bg: #f5f7f6;
      --panel: #ffffff;
      --panel-soft: #f9fbfa;
      --ink: #17221e;
      --muted: #64716c;
      --line: #dce5e1;
      --line-strong: #c9d6d0;
      --accent: #0f9f6e;
      --accent-dark: #087a54;
      --accent-soft: #e8f7f0;
      --danger: #c43b45;
      --danger-soft: #fff0f1;
      --warning: #a66410;
      --warning-soft: #fff7e7;
      --code: #1d2824;
      --shadow: 0 10px 30px rgba(25, 49, 41, 0.07);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 10% 0%, rgba(15, 159, 110, 0.07), transparent 27rem),
        var(--bg);
      color: var(--ink);
      font-family: "Outfit", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.58; }

    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 56px; }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .eyebrow-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }

    h1 { margin: 0; font-size: clamp(28px, 4vw, 40px); line-height: 1.12; letter-spacing: -0.035em; }
    .lead { max-width: 720px; margin: 10px 0 0; color: var(--muted); font-size: 15px; }

    .privacy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: none;
      padding: 9px 12px;
      border: 1px solid #bfe2d3;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 600;
      white-space: nowrap;
    }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr); gap: 18px; align-items: start; }
    .stack { display: grid; gap: 18px; }

    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.9);
    }

    .panel-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 15px; }
    .panel-title svg { color: var(--accent-dark); }
    .panel-body { padding: 18px; }

    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 600; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 400; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: var(--panel-soft);
      color: var(--ink);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    input, select { min-height: 42px; padding: 9px 11px; }
    textarea { min-height: 310px; padding: 13px; resize: vertical; font-family: "JetBrains Mono", "SFMono-Regular", monospace; font-size: 12.5px; line-height: 1.55; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(15, 159, 110, 0.11); }
    input.invalid, textarea.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(196, 59, 69, 0.08); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .url-row { display: grid; grid-template-columns: 1fr auto; gap: 9px; }
    .method-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; border-radius: 10px; background: var(--code); color: white; font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; }

    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 16px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-1px); border-color: #aabbb4; box-shadow: 0 5px 14px rgba(25, 49, 41, 0.07); }
    .btn-primary { min-width: 120px; border-color: var(--accent); background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { border-color: var(--accent-dark); background: var(--accent-dark); }
    .btn-danger { color: var(--danger); }
    .btn-small { min-height: 32px; padding: 6px 10px; font-size: 12px; }

    .progress-line { position: relative; height: 3px; overflow: hidden; border-radius: 999px; background: #e7eeeb; }
    .progress-line::after { content: ""; position: absolute; inset: 0; width: 36%; border-radius: inherit; background: var(--accent); transform: translateX(-100%); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { to { transform: translateX(380%); } }

    .response-text-panel { padding: 18px; border-bottom: 1px solid var(--line); background: var(--panel-soft); }
    .response-text-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .response-text-title { font-weight: 600; }
    .response-text-source { color: var(--muted); font-size: 11px; }
    .response-text-box { min-height: 150px; max-height: 300px; overflow: auto; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    .response-text-box.is-empty { display: grid; place-items: center; min-height: 180px; color: var(--muted); text-align: center; }
    .response-text-box.is-error { border-color: #f1c8cc; background: var(--danger-soft); color: var(--danger); }

    .result-head { padding: 18px; border-bottom: 1px solid var(--line); }
    .result-status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 999px; font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; }
    .status-ok { background: var(--accent-soft); color: var(--accent-dark); }
    .status-http { background: #eef2f1; color: #45534e; }
    .status-error { background: var(--danger-soft); color: var(--danger); }
    .latency { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12px; }

    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--line); }
    .metric { padding: 11px 12px; background: var(--panel-soft); }
    .metric span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; }
    .metric strong { display: block; overflow: hidden; text-overflow: ellipsis; font-family: "JetBrains Mono", monospace; font-size: 12px; white-space: nowrap; }

    .tabs { display: flex; gap: 3px; padding: 6px; border-bottom: 1px solid var(--line); background: #f7f9f8; }
    .tab { flex: 1; min-height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; }
    .tab:hover { color: var(--ink); }
    .tab.active { background: #fff; color: var(--ink); box-shadow: 0 1px 5px rgba(25, 49, 41, 0.08); }
    .tab-content { display: none; min-height: 300px; max-height: 540px; overflow: auto; }
    .tab-content.active { display: block; }
    pre { margin: 0; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; color: #d9e6e0; background: var(--code); font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.55; }
    .headers-list { display: grid; }
    .header-row { display: grid; grid-template-columns: minmax(120px, 0.42fr) minmax(0, 1fr); gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: "JetBrains Mono", monospace; font-size: 11.5px; }
    .header-row:last-child { border-bottom: 0; }
    .header-name { color: var(--accent-dark); overflow-wrap: anywhere; }
    .header-value { color: var(--ink); overflow-wrap: anywhere; }
    .curl-box { padding: 16px; background: var(--panel-soft); }
    .curl-box pre { min-height: 260px; border-radius: 10px; }

    .notice { display: none; margin-bottom: 14px; padding: 11px 12px; border-radius: 10px; font-size: 12px; }
    .notice.visible { display: block; }
    .notice-error { border: 1px solid #f1c8cc; background: var(--danger-soft); color: var(--danger); }
    .notice-warning { border: 1px solid #ecd6a8; background: var(--warning-soft); color: var(--warning); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; padding: 10px 14px; border-radius: 999px; background: var(--code); color: white; box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, 10px); pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 860px) {
      .shell { width: min(100% - 22px, 720px); padding-top: 22px; }
      .topbar { display: grid; }
      .privacy { justify-self: start; }
      .workspace { grid-template-columns: 1fr; }
      .result-panel { order: -1; }
    }

    @media (max-width: 560px) {
      .panel-body, .result-head { padding: 14px; }
      .grid-2, .metrics { grid-template-columns: 1fr; }
      .url-row { grid-template-columns: 1fr; }
      .method-chip { min-height: 36px; }
      .header-row { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow"><span class="eyebrow-dot"></span> Local POST Lab</div>
        <h1>通用 POST 接口测试</h1>
        <p class="lead">填写目标地址、认证信息与 JSON 请求体，发送 POST 请求并查看响应文本、状态码、耗时、响应头与原始返回。</p>
      </div>
      <div class="privacy">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        API Key 仅保存在当前页面内存
      </div>
    </header>

    <section class="workspace">
      <div class="stack">
        <section class="panel">
          <div class="panel-head">
            <h2 class="panel-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h10"></path><path d="M14 7l4-4"></path><path d="m18 3-4 4"></path><path d="M20 17H10"></path><path d="m6 17-4 4"></path><path d="m2 21 4-4"></path></svg>
              请求配置
            </h2>
          </div>
          <div class="panel-body">
            <div class="field">
              <label class="field-label" for="url"><span>目标 URL</span><span class="hint">POST</span></label>
              <div class="url-row">
                <input id="url" type="url" spellcheck="false" autocomplete="url" placeholder="https://example.com/api">
                <span class="method-chip">POST</span>
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label class="field-label" for="authMode">认证方式</label>
                <select id="authMode">
                  <option value="none">不发送</option>
                  <option value="x-api-key">x-api-key</option>
                  <option value="bearer">Authorization: Bearer</option>
                </select>
              </div>
              <div class="field">
                <label class="field-label" for="timeout"><span>超时时间</span><span class="hint">1–300 秒</span></label>
                <input id="timeout" type="number" min="1" max="300" value="120">
              </div>
            </div>

            <div class="field">
              <label class="field-label" for="apiKey"><span>API Key</span><button class="btn btn-small" id="toggleKey" type="button">显示</button></label>
              <input id="apiKey" type="password" autocomplete="new-password" spellcheck="false" placeholder="仅在本次页面会话中使用，不会写入文件">
            </div>

            <div class="field">
              <label class="field-label" for="headers"><span>额外 Headers</span><span class="hint">JSON 对象，可留空</span></label>
              <textarea id="headers" style="min-height:94px" spellcheck="false" placeholder="可留空，例如 {&quot;Accept&quot;: &quot;application/json&quot;}"></textarea>
            </div>

            <div class="field">
              <label class="field-label" for="body"><span>请求 JSON</span><span class="hint" id="jsonState">可为空</span></label>
              <textarea id="body" spellcheck="false" placeholder="可留空；填写后必须是合法 JSON"></textarea>
            </div>

            <div class="actions">
              <button class="btn btn-primary" id="send" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>
                发送请求
              </button>
              <button class="btn" id="cancel" type="button" disabled>取消</button>
              <button class="btn btn-danger" id="clearKey" type="button">清空密钥</button>
            </div>
          </div>
        </section>
      </div>

      <section class="panel result-panel">
        <div class="panel-head">
          <h2 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path><path d="M8 17h3"></path></svg>
            响应结果
          </h2>
          <button class="btn btn-small" id="copyResponse" type="button" disabled>复制响应</button>
        </div>

        <div class="response-text-panel">
          <div class="response-text-head">
            <span class="response-text-title">响应文本</span>
            <span id="responseTextSource" class="response-text-source">等待响应</span>
          </div>
          <div id="responseText" class="response-text-box is-empty">等待发送请求</div>
        </div>

        <div id="result" hidden>
          <div class="result-head">
            <div id="notice" class="notice"></div>
            <div class="result-status">
              <span id="statusPill" class="status-pill status-http">等待中</span>
              <span id="latency" class="latency">— ms</span>
            </div>
            <div class="metrics">
              <div class="metric"><span>响应大小</span><strong id="sizeMetric">—</strong></div>
              <div class="metric"><span>Content-Type</span><strong id="typeMetric">—</strong></div>
              <div class="metric"><span>完成时间</span><strong id="timeMetric">—</strong></div>
            </div>
          </div>

          <div class="tabs" role="tablist">
            <button class="tab active" type="button" data-tab="formatted">格式化</button>
            <button class="tab" type="button" data-tab="raw">原始正文</button>
            <button class="tab" type="button" data-tab="headers">响应头</button>
            <button class="tab" type="button" data-tab="curl">cURL</button>
          </div>
          <div id="tab-formatted" class="tab-content active"><pre id="formattedOutput"></pre></div>
          <div id="tab-raw" class="tab-content"><pre id="rawOutput"></pre></div>
          <div id="tab-headers" class="tab-content"><div id="responseHeaders" class="headers-list"></div></div>
          <div id="tab-curl" class="tab-content"><div class="curl-box"><pre id="curlOutput"></pre></div></div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const el = (id) => document.getElementById(id);
    let controller = null;
    let latestResultText = "";
    let toastTimer = null;

    function showToast(message) {
      const toast = el("toast");
      toast.textContent = message;
      toast.classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("visible"), 1800);
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
    }

    function setJSONState() {
      const text = el("body").value.trim();
      if (!text) {
        el("body").classList.remove("invalid");
        el("jsonState").textContent = "可为空";
        el("jsonState").style.color = "var(--muted)";
        return true;
      }
      try {
        JSON.parse(text);
        el("body").classList.remove("invalid");
        el("jsonState").textContent = "JSON 有效";
        el("jsonState").style.color = "var(--accent-dark)";
        return true;
      } catch (error) {
        el("body").classList.add("invalid");
        el("jsonState").textContent = "JSON 无效";
        el("jsonState").style.color = "var(--danger)";
        return false;
      }
    }

    function parseHeaders() {
      const text = el("headers").value.trim();
      if (!text) return {};
      const parsed = JSON.parse(text);
      if (!parsed || Array.isArray(parsed) || typeof parsed !== "object") {
        throw new Error("额外 Headers 必须是 JSON 对象。 ");
      }
      return parsed;
    }

    function shellQuote(value) {
      return `'${String(value).replaceAll("'", `'"'"'`)}'`;
    }

    function makeCurl(payload) {
      const parts = [
        "curl --request POST",
        `  --url ${shellQuote(el("url").value.trim())}`,
        `  --header ${shellQuote("Content-Type: application/json")}`,
      ];
      const headers = payload.headers;
      for (const [key, value] of Object.entries(headers)) {
        parts.push(`  --header ${shellQuote(`${key}: ${value}`)}`);
      }
      if (payload.authMode === "x-api-key") {
        parts.push('  --header "x-api-key: $POST_TEST_API_KEY"');
      } else if (payload.authMode === "bearer") {
        parts.push('  --header "Authorization: Bearer $POST_TEST_API_KEY"');
      }
      parts.push(`  --data-raw ${shellQuote(el("body").value)}`);
      return parts.join(" \\\n");
    }

    function setNotice(type, message) {
      const notice = el("notice");
      notice.className = "notice";
      if (!message) return;
      notice.classList.add("visible", type === "error" ? "notice-error" : "notice-warning");
      notice.textContent = message;
    }

    function statusClass(status) {
      if (status >= 200 && status < 300) return "status-ok";
      if (status >= 400) return "status-error";
      return "status-http";
    }

    function displayText(value) {
      if (typeof value === "string") return value;
      if (typeof value === "number" || typeof value === "boolean") return String(value);
      return "";
    }

    function extractResponseText(payload) {
      if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
        return { text: "", source: "未找到" };
      }

      const directText = displayText(payload.text);
      if (directText.trim()) return { text: directText, source: "顶层 text" };

      if (Array.isArray(payload.content)) {
        const contentText = payload.content
          .map((block) => {
            if (typeof block === "string") return block;
            if (block?.type === "text") return displayText(block.text);
            return "";
          })
          .filter((text) => text.trim())
          .join("\n\n");
        if (contentText.trim()) return { text: contentText, source: "content[].text" };
      }

      const choiceContent = payload.choices?.[0]?.message?.content;
      const choiceText = typeof choiceContent === "string"
        ? choiceContent
        : Array.isArray(choiceContent)
          ? choiceContent
            .map((block) => block?.type === "text" ? displayText(block.text) : "")
            .filter((text) => text.trim())
            .join("\n\n")
          : "";
      if (choiceText.trim()) return { text: choiceText, source: "choices[0].message.content" };

      return { text: "", source: "未找到" };
    }

    function setResponseText(text, source, isError = false) {
      const box = el("responseText");
      box.textContent = text;
      box.classList.toggle("is-empty", !text);
      box.classList.toggle("is-error", isError);
      el("responseTextSource").textContent = source;
    }

    function renderResult(result, payload) {
      el("result").hidden = false;
      el("result").hidden = false;
      el("copyResponse").disabled = false;
      if (window.matchMedia("(max-width: 860px)").matches) {
        el("result").scrollIntoView({ behavior: "smooth", block: "start" });
      }
      el("statusPill").className = `status-pill ${statusClass(result.status)}`;
      el("statusPill").textContent = `${result.status} ${result.statusText || ""}`.trim();
      el("latency").textContent = `${result.elapsedMs} ms`;
      el("sizeMetric").textContent = formatBytes(result.receivedBytes || 0);
      el("typeMetric").textContent = result.contentType || "未返回";
      el("timeMetric").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });

      const extracted = extractResponseText(result.json);
      setResponseText(
        extracted.text || "响应中未找到可提取文本",
        extracted.source
      );

      latestResultText = result.raw || "";
      el("rawOutput").textContent = result.raw || "";
      el("formattedOutput").textContent = typeof result.json === "string"
        ? result.json
        : JSON.stringify(result.json, null, 2);
      el("curlOutput").textContent = makeCurl(payload);
      el("responseHeaders").replaceChildren();
      for (const [name, value] of result.headers || []) {
        const row = document.createElement("div");
        row.className = "header-row";
        const key = document.createElement("div");
        key.className = "header-name";
        key.textContent = name;
        const val = document.createElement("div");
        val.className = "header-value";
        val.textContent = value;
        row.append(key, val);
        el("responseHeaders").append(row);
      }
      if (result.finalUrl && result.finalUrl !== el("url").value.trim()) {
        setNotice("warning", `发生跳转，最终地址：${result.finalUrl}`);
      } else {
        setNotice("", "");
      }
    }

    function renderError(error) {
      el("result").hidden = false;
      el("copyResponse").disabled = false;
      if (window.matchMedia("(max-width: 860px)").matches) {
        el("result").scrollIntoView({ behavior: "smooth", block: "start" });
      }
      el("statusPill").className = "status-pill status-error";
      el("statusPill").textContent = "本地请求失败";
      el("latency").textContent = "— ms";
      el("sizeMetric").textContent = "—";
      el("typeMetric").textContent = "—";
      el("timeMetric").textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
      setResponseText(error.error || "请求失败", "错误信息", true);
      latestResultText = JSON.stringify(error, null, 2);
      el("formattedOutput").textContent = latestResultText;
      el("rawOutput").textContent = latestResultText;
      el("responseHeaders").replaceChildren();
      setNotice("error", error.error || "请求失败");
    }

    function setBusy(busy) {
      el("send").disabled = busy;
      el("cancel").disabled = !busy;
      el("send").innerHTML = busy
        ? '<span style="width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite"></span>发送中'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>发送请求';
      if (busy) {
        el("statusPill").className = "status-pill status-http";
        el("statusPill").textContent = "请求中…";
        el("latency").textContent = "计时中";
      }
    }

    async function sendRequest() {
      if (!setJSONState()) {
        showToast("请求 JSON 格式不正确");
        el("body").focus();
        return;
      }
      let headers;
      try {
        headers = parseHeaders();
      } catch (error) {
        showToast(error.message);
        el("headers").focus();
        return;
      }
      if (el("authMode").value !== "none" && !el("apiKey").value.trim()) {
        showToast("请先填写 API Key");
        el("apiKey").focus();
        return;
      }

      const payload = {
        url: el("url").value.trim(),
        apiKey: el("apiKey").value,
        authMode: el("authMode").value,
        headers,
        body: el("body").value,
        timeoutSeconds: Number(el("timeout").value),
        verifyTls: true
      };

      controller = new AbortController();
      setBusy(true);
      setResponseText("请求中…", "等待响应");
      el("result").hidden = false;
      setNotice("", "");
      try {
        const response = await fetch("/api/proxy", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        const result = await response.json();
        if (!response.ok) {
          renderError(result);
        } else {
          renderResult(result, payload);
        }
      } catch (error) {
        if (error.name === "AbortError") {
          showToast("请求已取消");
        } else {
          renderError({ error: "无法连接本地服务。", detail: error.message });
        }
      } finally {
        setBusy(false);
        controller = null;
      }
    }

    setJSONState();

    el("body").addEventListener("input", setJSONState);
    el("send").addEventListener("click", sendRequest);
    el("cancel").addEventListener("click", () => controller?.abort());
    el("clearKey").addEventListener("click", () => {
      el("apiKey").value = "";
      showToast("API Key 已从页面内存清空");
      el("apiKey").focus();
    });
    el("toggleKey").addEventListener("click", () => {
      const input = el("apiKey");
      const visible = input.type === "text";
      input.type = visible ? "password" : "text";
      el("toggleKey").textContent = visible ? "显示" : "隐藏";
    });
    el("copyResponse").addEventListener("click", async () => {
      await navigator.clipboard.writeText(latestResultText);
      showToast("响应已复制");
    });

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => item.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");
        el(`tab-${tab.dataset.tab}`).classList.add("active");
      });
    });

    const style = document.createElement("style");
    style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
    document.head.append(style);
  </script>
</body>
</html>
